# SPEC-CI-MINIMAL (specs/SPEC-CI-MINIMAL-2026-10-13.md): the harness
# (stanok/launcher/tests_harness) must run green on a bare runner — no
# k8s cluster, no docker, no jq, no repo .venv. The contract is the exact
# SET of skipped-test nodeids (<path>.py::<test-name>, .github/
# ci-expected-skips.txt; nodeid revision 2026-10-20 per operator decision:
# extracted from the junit-xml by launcher/ci_skips.py — line numbers are
# deliberately NOT part of the contract, editing a test file no longer
# reddens CI by moving a skip statement): the environment probes skip with
# reasons (skip-guards in the tests), and ANY change of the set — a
# substitution at the same count included — fails CI. The count (exactly
# 10) is kept as a secondary check.
# The workflow lives in the PARENT repo: the guard test
# test_supervisor_zone_not_published needs the published-parent layout
# (parent checkout + stanok submodule) — a stanok-only CI cannot run it.
# Python matrix (operator order 2026-10-20, ruff/mypy wave): the harness runs
# green on 3.11 (the Pod image / floor) AND 3.13 (the host venv / upgrade
# readiness). Both legs must produce the SAME 10-nodeid skip set — that is
# why a non-3.11 leg installs a secondary 3.11 interpreter FIRST (the primary
# setup comes after it, so `python` still resolves to the matrix version):
# test_resource_peaks.test_py311_join_contract guards on
# shutil.which("python3.11") — found it RUNS (published-set state), absent it
# would skip; the secondary install keeps it running on every leg.
# The lint tools (ruff==0.15.20 / mypy==2.2.0 / shellcheck-py==0.11.0.1,
# pinned in stanok/ lint-requirements.lock — same uv/hashes format as
# image-requirements.lock) are installed in THIS job, not in a separate lint
# job: test_lint_gates' and test_shellcheck_gates' probes run where the
# tools are present and skip with a reason where not — dropping the install
# would add skips and redden the published skip-set contract from the other
# side.
# Hardening per operator review 2026-10-13: -rs (skip reasons in the log),
# runner pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 on
# 2026-10-19), actions/checkout + actions/setup-python pinned to exact
# commit SHAs (v7 tags, resolved via git ls-remote 2026-10-16 — a tag is
# movable, a SHA is not), least-privilege permissions, explicit pytest
# preflight (the run.sh tests call python3 -m pytest — a missing pytest
# must fail loudly before the suite).
name: harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout parent + stanok submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: true

      - name: Secondary interpreter 3.11 (skip-set parity across matrix legs)
        if: matrix.python-version != '3.11'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Set up Python ${{ matrix.python-version }} (image-requirements.lock resolution)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install pinned deps (uv-compiled, sha256-hashed lock)
        run: python -m pip install -r stanok/image-requirements.lock

      - name: Install pinned lint tools (the ruff/mypy gates run via test_lint_gates)
        run: python -m pip install -r stanok/lint-requirements.lock

      - name: Preflight — the interpreter has pytest
        run: python3 -m pytest --version

      - name: Run harness in a bare environment (docker/jq/kubectl hidden)
        run: |
          set -euo pipefail
          # PATH farm: every executable from the runner PATH except the three
          # tools the bare contract hides — the skip-guards fire on
          # shutil.which() == None. First occurrence wins; non-executables
          # and dangling links are skipped.
          FARM="$RUNNER_TEMP/barepath"
          mkdir -p "$FARM"
          IFS=:
          for d in $PATH; do
            [ -d "$d" ] || continue
            for t in "$d"/*; do
              [ -x "$t" ] || continue
              n="${t##*/}"
              case "$n" in docker|docker.io|docker-compose|jq|kubectl) continue ;; esac
              [ -e "$FARM/$n" ] || [ -L "$FARM/$n" ] || ln -s "$t" "$FARM/$n" 2>/dev/null || true
            done
          done
          unset IFS
          export PATH="$FARM"
          cd stanok
          rc=0
          python -m pytest launcher/tests_harness -q -rs --junitxml="$GITHUB_WORKSPACE/skips.xml" 2>&1 | tee "$GITHUB_WORKSPACE/pytest.log" || rc=$?
          echo "pytest rc=$rc"
          skipped=$(grep -oE '[0-9]+ skipped' "$GITHUB_WORKSPACE/pytest.log" | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "skipped=$skipped (expected exactly 10)"
          # Skip-set contract: extract skipped-test nodeids from the junit-xml
          # (launcher/ci_skips.py, fail-closed: an unresolvable testcase emits
          # <unresolved> and the diff fails) and diff against the expected
          # list. A substitution at count 10 fails here.
          python -m launcher.ci_skips "$GITHUB_WORKSPACE/skips.xml" | sort > "$GITHUB_WORKSPACE/skipped-actual.txt"
          grep -vE '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/.github/ci-expected-skips.txt" | sort > "$GITHUB_WORKSPACE/skipped-expected.txt"
          if ! diff -u "$GITHUB_WORKSPACE/skipped-expected.txt" "$GITHUB_WORKSPACE/skipped-actual.txt"; then
            echo "::error::skip-set contract violated: actual SKIPPED set differs from .github/ci-expected-skips.txt"
            exit 1
          fi
          if [ "$rc" -ne 0 ] || [ "$skipped" -ne 10 ]; then
            echo "::error::harness contract violated: rc=$rc, skipped=$skipped (expected rc=0, exactly 10 skipped)"
            exit 1
          fi
